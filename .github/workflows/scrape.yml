name: Pelindo Auto Scraper

on:
  schedule:
    # Berjalan otomatis setiap 2 jam sekali (Cron UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Agar bisa dijalankan manual dari tab Actions

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Updated Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data Pelindo [skip ci]" && git push)
